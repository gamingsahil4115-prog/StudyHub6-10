let currentClass=null,currentSubject=null,currentChapter=null;
const app=document.getElementById('app');
function home(){
app.innerHTML=`<section class="hero"><b>Learn Today<br><span class="gold">Lead Tomorrow</span></b><p class="muted">Your Success is Our Goal</p></section>
<div class="section"><h2>🎓 Select Your Class</h2><span class="link">6th - 10th</span></div>
<div class="classgrid">${[6,7,8,9,10].map(c=>`<button class="classbtn" onclick="classPage(${c})"><span>${c}</span><small>Class ${c}</small></button>`).join('')}</div>
<div class="section"><h2>⭐ Features</h2></div>
<div class="grid">
${[['📖','Notes','Chapter-wise Notes'],['❓','Questions','Important Questions & Answers'],['✓','MCQ Quiz','Test Your Knowledge'],['📄','Model Papers','Practice Papers'],['📊','Quiz Score','Check Performance'],['🔖','Bookmarks','Save Important Topics'],['🔎','Search','Find Any Topic'],['💡','GK Corner','General Knowledge']].map(x=>`<div class="card" onclick="${x[1]=='Search'?'document.getElementById(\\'search\\').focus()':x[1]=='Quiz Score'?'quizHub()':x[1]=='Bookmarks'?'showBookmarks()':'classesPage()'}"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`;
}
function classesPage(){app.innerHTML=`<button class="back" onclick="home()">← Home</button><h2>Choose Your Class</h2><div class="list">${[6,7,8,9,10].map(c=>`<div class="row" onclick="classPage(${c})"><b>🎓 Class ${c}</b><small>All available subjects</small></div>`).join('')}</div>`}
function classPage(c){currentClass=c;app.innerHTML=`<button class="back" onclick="classesPage()">← Classes</button><h2>Class ${c}</h2><p class="muted">Choose a subject</p><div class="grid">${Object.keys(DATA[c]).map((s,i)=>`<div class="card" onclick="subjectPage('${s.replace(/'/g,"\\'")}')"><div class="icon">${['📐','🔬','🔤','अ','🌍','💻','💡'][i]}</div><h3>${s}</h3><p>${DATA[c][s].length} starter chapters</p></div>`).join('')}</div>`}
function subjectPage(s){currentSubject=s;app.innerHTML=`<button class="back" onclick="classPage(${currentClass})">← Class ${currentClass}</button><h2>${s}</h2><p class="muted">Chapter list</p><div class="list">${DATA[currentClass][s].map((ch,i)=>`<div class="row" onclick="chapterPage(${i})"><b>${i+1}. ${ch.name}</b><small>Notes • Questions • Practice</small></div>`).join('')}</div>`}
function chapterPage(i){currentChapter=i;let ch=DATA[currentClass][currentSubject][i];app.innerHTML=`<button class="back" onclick="subjectPage('${currentSubject.replace(/'/g,"\\'")}')">← ${currentSubject}</button><div class="section"><h2>${ch.name}</h2><button class="back" onclick="toggleBookmark()" style="margin:0">🔖 Save</button></div><span class="pill">Class ${currentClass}</span><span class="pill">${currentSubject}</span><div class="note">${ch.note}</div><h3>📌 Key Revision Points</h3><ul class="points">${ch.points.map(p=>`<li>${p}</li>`).join('')}</ul><h3>❓ Practice Questions</h3>${ch.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${q.q}</b><br><button onclick="this.nextElementSibling.style.display='block'">Show Answer</button><div class="ans">${q.a}</div></div>`).join('')}`}
function key(){return `${currentClass}|${currentSubject}|${currentChapter}`}
function toggleBookmark(){let b=JSON.parse(localStorage.getItem('bookmarks')||'[]');let k=key();b=b.includes(k)?b.filter(x=>x!==k):[...b,k];localStorage.setItem('bookmarks',JSON.stringify(b));alert(b.includes(k)?'Saved to Bookmarks':'Removed from Bookmarks')}
function showBookmarks(){let b=JSON.parse(localStorage.getItem('bookmarks')||'[]');app.innerHTML=`<button class="back" onclick="home()">← Home</button><h2>🔖 Bookmarks</h2>${b.length?'<div class="list">'+b.map(k=>{let [c,s,i]=k.split('|');return `<div class="row" onclick="currentClass=${c};currentSubject='${s.replace(/'/g,"\\'")}';chapterPage(${i})"><b>Class ${c} • ${s}</b><small>${DATA[c][s][i].name}</small></div>`}).join('')+'</div>':'<div class="empty">No bookmarks yet.<br>Open a chapter and tap Save.</div>'}`}
function quizHub(){app.innerHTML=`<button class="back" onclick="home()">← Home</button><h2>✓ MCQ Quiz</h2><p class="muted">Choose a class and subject to start a quick quiz.</p><div class="list">${[6,7,8,9,10].map(c=>`<div class="row" onclick="quizClass(${c})"><b>Class ${c}</b><small>Start quiz</small></div>`).join('')}</div>`}
function quizClass(c){currentClass=c;app.innerHTML=`<button class="back" onclick="quizHub()">← Quiz</button><h2>Class ${c} Quiz</h2><div class="list">${Object.keys(DATA[c]).map(s=>`<div class="row" onclick="startQuiz('${s.replace(/'/g,"\\'")}')"><b>${s}</b><small>5 questions</small></div>`).join('')}</div>`}
function startQuiz(s){currentSubject=s;let qs=DATA[currentClass][s].flatMap(ch=>ch.questions).slice(0,5);let score=0;app.innerHTML=`<button class="back" onclick="quizClass(${currentClass})">← Subjects</button><h2>${s} Quiz</h2><div id="quiz"></div>`;qs.forEach((q,i)=>{document.getElementById('quiz').innerHTML+=`<div class="q"><b>${i+1}. ${q.q}</b><br><button onclick="quizAnswer(this,true)">Correct idea</button><button onclick="quizAnswer(this,false)">Try again</button><div class="ans">${q.a}</div></div>`});document.getElementById('quiz').innerHTML+=`<button class="back" onclick="quizClass(${currentClass})">Finish / Back</button>`}
function quizAnswer(btn,ok){btn.disabled=true;if(ok){btn.parentElement.style.borderColor='#8bea22';}else{btn.parentElement.style.borderColor='#ff4f87';}btn.nextElementSibling?.style}
function searchAll(q){q=q.toLowerCase().trim();if(!q){home();return}let out=[];for(const c of Object.keys(DATA))for(const s of Object.keys(DATA[c]))for(let i=0;i<DATA[c][s].length;i++){let ch=DATA[c][s][i];if(`${c} ${s} ${ch.name}`.toLowerCase().includes(q))out.push({c,s,i,ch})}app.innerHTML=`<button class="back" onclick="home()">← Home</button><h2>Search Results</h2>${out.length?'<div class="list">'+out.map(x=>`<div class="row" onclick="currentClass=${x.c};currentSubject='${x.s.replace(/'/g,"\\'")}';chapterPage(${x.i})"><b>Class ${x.c} • ${x.s}</b><small>${x.ch.name}</small></div>`).join('')+'</div>':'<div class="empty">No matching topic found.</div>'}`}
function morePage(){app.innerHTML=`<button class="back" onclick="home()">← Home</button><h2>More</h2><div class="card"><h3>Study Hub 6-10</h3><p>JKBOSE-focused educational app for Classes 6-10.</p><br><p class="muted">This version contains an original starter library and app framework. Verify and add the official, current JKBOSE chapter-wise content before publishing.</p></div>`}
home();
</script>
</body></html>
